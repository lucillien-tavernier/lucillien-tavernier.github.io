<!DOCTYPE html>
<html lang="fr">
<head>

    -->

      <div id="gallery">
        <!-- Placeholder pendant le chargement -->
        <p style="text-align:center; color:#a09e98">Chargement des œuvres…</p>
      </div>

  <div data-include="footer"></div>

       car gallery appelle window.initLightbox() -->

  <script src="./js/gallery.js"></script>
</body>
</html>
